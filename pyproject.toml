[project]
name = "silver-spoon2"
version = "0.1.0"
description = "Wikipedia RAG take-home"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires docker compose up -d (excluded from default runs)",
]

[tool.coverage.run]
source = ["backend/app"]
branch = false
omit = [
    "backend/app/main.py",
    "backend/app/config.py",
    "backend/app/domain/models.py",
    "backend/app/api/__init__.py",
    "backend/app/**/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
